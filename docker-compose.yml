services:
  freelance-analyser:
    build: .
    container_name: freelance-analyser
    user: "1234:1234"
    env_file: .env
    volumes:
      - .:/app:z
      - ./data:/app/data:z
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

  web:
    build: .
    container_name: freelance-analyser-web
    user: "1234:1234"
    command: uvicorn src.web:app --host 0.0.0.0 --port 8080 --reload
    env_file: .env
    volumes:
      - .:/app:z
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: freelance-analyser-db
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
